name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build app
        run: VERSION="$(cat VERSION)" scripts/build-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: JokenBar
          path: dist/*.zip

      # Bumping VERSION on main publishes a release tagged v<VERSION>.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(cat VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"
          else
            gh release create "$TAG" dist/JokenBar.zip --target "$GITHUB_SHA" --title "JokenBar $TAG" --generate-notes
          fi
